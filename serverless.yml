service: av-compliance-checker

provider:
  name: aws
  runtime: nodejs24.x
  stage: dev
  timeout: 60
  region: eu-west-1
  environment:
    AWS_ACCESS_KEY_ID: accessKeyId
    AWS_SECRET_ACCESS_KEY: secretAccessKey

functions:
  app:
    handler: dist/src/proxy/index.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY

custom:
  serverless-offline:
    httpPort: 3003
    noPrependStageInUrl: true
    allowCache: true

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
